{% extends "base.html" %}

{% block content %}

<div class="container py-4">

    <!-- ================================================= -->
    <!-- ENCABEZADO                                        -->
    <!-- ================================================= -->

    <div
        class="d-flex
               justify-content-between
               align-items-center
               flex-wrap
               gap-3
               mb-4"
    >

        <div>

            <h2 class="mb-1">
                Especificación de Requisitos
                de Software
            </h2>

            <p class="text-muted mb-0">
                Proyecto:
                <strong>
                    {{ project.name }}
                </strong>
            </p>

        </div>


        <div class="d-flex gap-2">

            <a
                href="{{ url_for(
                    'main.download_srs',
                    document_id=document.id
                ) }}"
                class="btn btn-success"
            >
                Descargar Word
            </a>


            <a
                href="{{ url_for(
                    'main.project_detail',
                    project_id=project.id
                ) }}"
                class="btn btn-outline-secondary"
            >
                Volver al proyecto
            </a>

        </div>

    </div>


    <!-- ================================================= -->
    <!-- INFORMACIÓN DEL DOCUMENTO                         -->
    <!-- ================================================= -->

    <div class="card mb-4">

        <div class="card-body">

            <div class="row">

                <div class="col-md-6">

                    <strong>
                        Documento:
                    </strong>

                    SRS IEEE 830-1998

                </div>


                <div class="col-md-6">

                    <strong>
                        ID:
                    </strong>

                    {{ document.id }}

                </div>

            </div>

        </div>

    </div>


    <!-- ================================================= -->
    <!-- CONTENIDO                                         -->
    <!-- ================================================= -->

    <div class="card shadow-sm">

        <div class="card-header">

            <strong>
                Documento generado
            </strong>

        </div>


        <div class="card-body">

            <pre class="srs-content">{{ document.content }}</pre>

        </div>

    </div>

</div>


<style>

.srs-content {

    white-space: pre-wrap;
    word-wrap: break-word;

    font-family:
        "Times New Roman",
        Times,
        serif;

    font-size: 16px;
    line-height: 1.7;

    color: #212529;

    background-color: #ffffff;

    border: none;

    margin: 0;
    padding: 20px;
}

</style>

{% endblock %}
